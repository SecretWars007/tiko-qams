user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    sendfile        on;
    keepalive_timeout  65;

    proxy_cache_path /var/cache/nginx/qams levels=1:2 keys_zone=qams:10m inactive=60m max_size=10g;

    upstream tiko-qams_backend {
        server backend1:80;
        server backend2:80;
    }

    server {
        listen 80;
        server_name qams.local;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl; 
        server_name qams.local localhost;

        ssl_certificate /etc/nginx/certs/cert.crt;
        ssl_certificate_key /etc/nginx/certs/cert.key;

        root /usr/share/nginx/html;
        index index.html index.htm;
        
        location / {
            try_files $uri $uri/ /index.html;
        }  
        location /api {
            proxy_pass http://tiko-qams_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache qams;
            proxy_cache_valid 200 301 302 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_valid 500 502 503 504 1m;
            proxy_cache_lock on;
            proxy_cache_min_uses 1;
            proxy_cache_bypass $http_pragma;
            proxy_cache_revalidate on;
            proxy_cache_use_stale error timeout invalid_header http_500;            
            
            proxy_cache_key "$scheme$host$uri$is_args$args";
        }      
        location /health {
            return 200 'EPICA 1 INFRA FULL OK - FRONTEND + NGINX 80->443 + POSTGRESQL + REDIS + MAILHOG 1025/8025 + SEQ 5341 + BACKEND X2 ';
            add_header Content-Type text/plain;
        }   
    }
}