services:
  postgres:
    image: postgres:14-alpine
    container_name: tiko-qams-postgres
    ports:
      - "5432:5432"  
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=qams
    volumes:
      - postgres_data:/var/lib/postgresql/data,
      - ../../backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - tiko-qams_network
  
  redis:
    image: redis:7-alpine
    container_name: tiko-qams-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - tiko-qams_network
  
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: tiko-qams-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - tiko-qams_network
    
  seq:
    image: datalust/seq:2023.4
    container_name: tiko-qams-seq
    ports:
      - "5341:80"
    environment:
      - ACCEPT_EULA=Y
    volumes:
      - seq_data:/data
    networks:
      - tiko-qams_network
    
  backend1:
    image: traefik/whoami:v1.10
    container_name: tiko-qams-backend1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`qams.local`)"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"
    networks:
      - tiko-qams_network
  
  backend2:
    image: traefik/whoami:v1.10
    container_name: tiko-qams-backend2
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`qams.local`)"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"
    networks:
      - tiko-qams_network
  
  frontend:
    image: busybox:1.36
    container_name: tiko-qams-frontend
    volumes:
      - frontend_dist:/dist
    command: sh -c "echo '<h1>QAMS FRONTEND OK</h1>' > /dist/index.html"
    networks:
      - tiko-qams_network
  
  nginx:
    image: nginx:1.25-alpine
    container_name: tiko-qams-nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../certs:/etc/nginx/certs:ro
      - frontend_dist:/usr/share/nginx/html
    depends_on:
      backend1: { condition: service_started }
      backend2: { condition: service_started }
      frontend: { condition: service_started }
      postgres: { condition: service_healthy }
    networks:
      - tiko-qams_network
volumes:
  postgres_data: {}
  seq_data: {}
  frontend_dist: {}
networks:
  tiko-qams_network:
    name: tiko-qams_network
    driver: bridge